<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showroom Changan</title>
    <!-- Manifest is SSR-inlined by functions/index.ts as <script id=manifest-data>;
         the /api/manifest preload would only fire when KV is empty, so it's dropped
         from the static shell to keep the HTML tiny. -->
    <!-- Self-hosted Lato 400 latin — the dominant weight in the showroom UI.
         crossorigin is required for font preloads even when same-origin. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lato-400.woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
